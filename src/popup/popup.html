<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clip2File</title>
  <link rel="stylesheet" href="./popup.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-brand">
        <img src="../icons/icon48.png" class="brand-mark" alt="" />
        <span class="brand-name">Clip2File</span>
      </div>
      <button id="options-btn" class="icon-btn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8.6 2.4c.2-.7.9-1.2 1.7-1.2s1.5.5 1.7 1.2l.2.7c.6.2 1.2.5 1.7.9l.7-.3c.7-.3 1.5-.1 2 .5.4.6.5 1.4.1 2l-.4.6c.3.6.5 1.2.6 1.8l.7.2c.7.2 1.2.9 1.2 1.7s-.5 1.5-1.2 1.7l-.7.2c-.1.6-.3 1.2-.6 1.8l.4.6c.4.6.3 1.4-.1 2-.5.6-1.3.8-2 .5l-.7-.3c-.5.4-1.1.7-1.7.9l-.2.7c-.2.7-.9 1.2-1.7 1.2s-1.5-.5-1.7-1.2l-.2-.7c-.6-.2-1.2-.5-1.7-.9l-.7.3c-.7.3-1.5.1-2-.5-.4-.6-.5-1.4-.1-2l.4-.6a6.9 6.9 0 0 1-.6-1.8l-.7-.2C1.5 11.5 1 10.8 1 10s.5-1.5 1.2-1.7l.7-.2c.1-.6.3-1.2.6-1.8l-.4-.6c-.4-.6-.3-1.4.1-2 .5-.6 1.3-.8 2-.5l.7.3c.5-.4 1.1-.7 1.7-.9l.2-.7Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
          <circle cx="10" cy="10" r="2.6" stroke="currentColor" stroke-width="1.4"/>
        </svg>
      </button>
    </header>

    <main class="scroll-area">
      <!-- Content input -->
      <section class="panel">
        <div class="panel-label">
          <svg class="panel-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 2.5h5.6L15 5.9v10.1a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 5 16V4a1.5 1.5 0 0 1 1-1.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
            <path d="M11.4 2.5V6h3.4" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
            <path d="M7.5 10h5M7.5 12.5h5M7.5 7.5h2.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
          <span>Content</span>
        </div>
        <textarea id="source-input" rows="6" placeholder="Paste or edit content here…"></textarea>

        <div id="detect-info" class="detect-pill hidden">
          <span id="detect-dot" class="detect-dot"></span>
          <span id="detect-label" class="detect-type">Type: Text</span>
          <span id="detect-confidence" class="detect-confidence"></span>
        </div>
      </section>

      <!-- Image preview (shown when clipboard has images) -->
      <section id="image-section" class="panel hidden">
        <div class="panel-label">
          <svg class="panel-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2.5" y="3.5" width="15" height="13" rx="2" stroke="currentColor" stroke-width="1.4"/>
            <circle cx="7" cy="8" r="1.4" stroke="currentColor" stroke-width="1.3"/>
            <path d="M3.5 14.5 8 10.5l2.3 2.1L13 9.8l3.5 4.2" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
          </svg>
          <span>Images from clipboard</span>
        </div>
        <div id="image-list" class="image-grid"></div>
      </section>

      <!-- Single-file mode -->
      <section id="single-mode" class="panel">
        <div class="panel-label">
          <svg class="panel-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4.5 3.5h7l4 4v9a1 1 0 0 1-1 1h-10a1 1 0 0 1-1-1v-12a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
          </svg>
          <span>Filename</span>
        </div>
        <input type="text" id="filename-input" placeholder="untitled.txt" class="text-field" />
        <div class="btn-stack">
          <button id="save-btn" class="btn btn-primary">
            <svg class="btn-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M10 3v9.5M10 12.5 6.8 9.3M10 12.5l3.2-3.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M4 14.5v1.3A1.2 1.2 0 0 0 5.2 17h9.6a1.2 1.2 0 0 0 1.2-1.2v-1.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <span class="btn-label">Save File</span>
          </button>
          <button id="save-md-btn" class="btn btn-secondary hidden">
            <svg class="btn-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M4.5 3.5h7l4 4v9a1 1 0 0 1-1 1h-10a1 1 0 0 1-1-1v-12a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
              <path d="M7 11.5h6M7 14h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
            <span class="btn-label">Save as HTML</span>
          </button>
          <button id="save-zip-btn" class="btn btn-ghost hidden">
            <svg class="btn-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="4" y="3" width="12" height="14" rx="1.6" stroke="currentColor" stroke-width="1.4"/>
              <path d="M9.6 3v2M9.6 6.5v2M9.6 10v2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
            <span class="btn-label">Save as ZIP</span>
          </button>
        </div>
      </section>

      <!-- Multi-file project mode -->
      <section id="project-mode" class="panel hidden">
        <div class="project-header">
          <div class="panel-label">
            <svg class="panel-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M2.5 6a1.5 1.5 0 0 1 1.5-1.5h3l1.4 1.6H16A1.5 1.5 0 0 1 17.5 7.6v6.9A1.5 1.5 0 0 1 16 16H4A1.5 1.5 0 0 1 2.5 14.5V6Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
            </svg>
            <span>Project files</span>
          </div>
          <div class="project-actions">
            <button id="select-all-btn" class="chip-btn" title="Select all">All</button>
            <button id="select-none-btn" class="chip-btn" title="Select none">None</button>
          </div>
        </div>
        <div id="file-list" class="file-list"></div>
        <input type="text" id="zip-name-input" placeholder="project.zip" class="text-field text-field-mono" />
        <button id="zip-btn" class="btn btn-primary">
          <svg class="btn-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="4" y="3" width="12" height="14" rx="1.6" stroke="currentColor" stroke-width="1.4"/>
            <path d="M9.6 3v2M9.6 6.5v2M9.6 10v2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
          <span class="btn-label">Generate ZIP</span>
        </button>
      </section>
    </main>

    <div id="status" class="toast hidden"></div>
  </div>

  <script type="module" src="./popup.ts"></script>
</body>
</html>
